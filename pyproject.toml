[project]
name = "svc-c2-098"
version = "1.0.0"
description = "Outsourcing SLA Deviation RCA Rebuttal-Brief Agent — AgentCore Template"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is NOT a public-PyPI dependency; it is
# supplied by the platform's own package registry at build time. Pinning it here
# would make `pip install -e .` fail because it is not resolvable from the
# default index.
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",
    # ingest-file-sanitizer の DOCX 経路が要求する。未導入だと XXE 防御が
    # 安全でない標準 parser へ静かに落ちる。
    "defusedxml==0.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[build-system]
requires = ["setuptools==68.0.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
